services:
  postgres:
    image: postgres:alpine3.21
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: mydb
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      retries: 5

  app:
    image: developerwk44/product_management_work:latest
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '8000:8000'
      - '5555:5555'
